services:
    php:
        build:
            dockerfile: docker/Dockerfile
            target: php-dev
        volumes:
            - ./:/var/www/html
        depends_on:
            - db

    nginx:
        image: nginx:1
        ports:
            - "8010:80"
            - "8453:443"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/ssl:/etc/ssl
        depends_on:
            - php

    node:
        build:
            dockerfile: docker/Dockerfile
            target: node-dev
        volumes:
            - ./:/var/www/html
        tty: true
        command: sh -c "npm install && npm run watch"

    db:
        image: mariadb:latest
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: travel_api
        volumes:
            - db:/var/lib/mysql
        ports:
            - "3309:3306"

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "8082:80"
        depends_on:
            - db

volumes:
    db:
